<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ใบปิดกะปั๊มน้ำมัน</title>
<style>
  :root{
    --bg: #0b0f0d;
    --panel: #121a17;
    --panel2: #17211d;
    --line: #2a3a33;
    --amber: #f5a623;
    --amber-dim: #a8781e;
    --green: #3fae5c;
    --text: #eef0ec;
    --muted: #8ea08f;
    --red: #e35d5d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:sans-serif; padding:24px 16px 60px;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:1000px; margin:0 auto;}
  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--amber); padding-bottom:14px; margin-bottom:20px;
  }
  header.top h1{font-size:20px; margin:0; font-weight:700;}
  .shift-badge{
    color:var(--green); border:1px solid #1f5c35;
    padding:4px 10px; border-radius:3px; font-size:13px; background-color: #0b2214;
  }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:18px;}
  .card h2{font-size:13px; color:var(--amber); margin:0 0 12px 0; font-weight:600; display:flex; align-items:center; gap:8px;}
  .card h2::before{content:""; width:3px; height:14px; background:var(--amber); display:inline-block;}
  .grid-info{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  input[type=date],select{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:7px 8px; font-size:14px;}
  .line-item{display:grid; grid-template-columns:1fr 130px; gap:8px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line);}
  .line-item label{margin:0; font-size:13px; color:var(--text);}
  .toolbar{margin-top:22px; padding-top:16px; border-top:1px solid var(--line);}
  .btn{padding:9px 16px; border-radius:5px; border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; font-size:13.5px;}
  .btn.primary{background:var(--amber); color:#1b1204; border-color:var(--amber); font-weight:600;}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ใบปิดกะปั๊มน้ำมัน</h1>
    </div>
    <div class="shift-badge">⚡ INSTANT SPEED ONLINE</div>
  </header>

  <div class="card">
    <h2>ข้อมูลพนักงานประจำกะ</h2>
    <div class="grid-info">
      <div>
        <label for="employee-select">เลือกพนักงาน</label>
        <select id="employee-select">
          <option value="">-- กำลังดึงรายชื่อ... --</option>
        </select>
      </div>
      <div>
        <label for="shift-date">วันที่ประจำการ</label>
        <input type="date" id="shift-date">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>รายการลูกค้าเงินเชื่อ (ยอดค้างชำระประจำกะ)</h2>
    <div id="credit-list-container">
      <div style="color:var(--muted); font-size:13px; padding:10px 0;">กำลังดึงข้อมูลเงินเชื่อความเร็วสูง...</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn primary" onclick="alert('ระบบบันทึกเรียบร้อย')">บันทึกข้อมูลเข้าชีตทดสอบ</button>
  </div>
</div>

<script>
  const WEB_APP_URL = "https://google.com"; 
  const SHEETS_SECRET = "123456"; 

  function loadDataInstant() {
    const selectElement = document.getElementById('employee-select');
    const creditContainer = document.getElementById('credit-list-container');

    // ⚡ ดึงรายชื่อพนักงาน
    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'list', prefix: 'emp_', secret: SHEETS_SECRET })
    })
    .then(res => res.json())
    .then(res => {
      if (res.error) return;
      selectElement.innerHTML = '<option value="">-- เลือกรายชื่อพนักงาน --</option>';
      res.keys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = res.data[key];
        selectElement.appendChild(option);
      });
    }).catch(() => { selectElement.innerHTML = '<option value="">เปิดโหมดออฟไลน์</option>'; });

    // ⚡ ดึงข้อมูลเงินเชื่อ
    fetch(WEB_APP_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'list', prefix: 'credit_', secret: SHEETS_SECRET })
    })
    .then(res => res.json())
    .then(res => {
      if (res.error) return;
      creditContainer.innerHTML = '';
      if (res.keys.length === 0) {
        creditContainer.innerHTML = '<div style="color:var(--muted); font-size:13px;">ไม่มีรายการเงินเชื่อค้างชำระ</div>';
        return;
      }
      res.keys.forEach(key => {
        const row = document.createElement('div');
        row.className = 'line-item';
        row.innerHTML = `
          <label>${key.replace('credit_', '')}</label>
          <input type="text" value="${res.data[key]} บาท" readonly style="background:transparent; border:none; color:var(--amber); font-weight:700; text-align:right;" />
        `;
        creditContainer.appendChild(row);
      });
    }).catch(() => { creditContainer.innerHTML = '<div style="color:var(--muted);">ไม่สามารถดึงข้อมูลเครือข่ายมือถือได้</div>'; });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const dateInput = document.getElementById('shift-date');
    if(dateInput) dateInput.value = new Date().toISOString().split('T')[0];
    loadDataInstant();
  });

  // บังคับลงทะเบียน Service Worker ด่วนพิเศษ
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=4');
  }
</script>
</body>
</html>
